name: Install realistic memorial images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-realistic-memorial-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch homepage imagery
        run: python tools/patch_realistic_memorial_images.py

      - name: Validate visual replacement
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/memorial-care-before.webp
          test -f assets/memorial-care-after.webp
          grep -Fq 'assets/memorial-care-before.webp?v=20260911' index.html
          grep -Fq 'assets/memorial-care-after.webp?v=20260911' index.html
          grep -Fq 'Illustrative sample only.' index.html
          grep -Fq 'realistic memorial comparison' trust.css
          ! grep -Fq 'photo-placeholder before' index.html
          ! grep -Fq 'grave-memorial-cleaning-before-after.jpg?v=20260911' index.html

      - name: Commit homepage visual upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/patch_realistic_memorial_images.py
          git add index.html trust.css
          git commit -m 'Use realistic before and after memorial imagery'
          git push
