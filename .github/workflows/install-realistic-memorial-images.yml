name: Install realistic memorial images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-realistic-memorial-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild image assets
        shell: bash
        run: |
          set -euo pipefail
          cat staging/before.part00 staging/before.part01 staging/before.part02 staging/before.part03 > /tmp/before.b64
          cat staging/after.part00 staging/after.part01 staging/after.part02 staging/after.part03 > /tmp/after.b64
          test "$(wc -c < /tmp/before.b64)" -eq 13484
          test "$(wc -c < /tmp/after.b64)" -eq 12064
          base64 -d /tmp/before.b64 > assets/memorial-care-before.webp
          base64 -d /tmp/after.b64 > assets/memorial-care-after.webp
          test "$(wc -c < assets/memorial-care-before.webp)" -eq 10112
          test "$(wc -c < assets/memorial-care-after.webp)" -eq 9048
          test "$(head -c 4 assets/memorial-care-before.webp)" = 'RIFF'
          test "$(head -c 4 assets/memorial-care-after.webp)" = 'RIFF'

      - name: Commit image assets and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r staging
          git add assets/memorial-care-before.webp assets/memorial-care-after.webp
          git commit -m 'Add realistic illustrative memorial care images'
          git push
