name: Swap WTR hero memorial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/swap-hero-memorial.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace repeated hero memorial
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '''      <div class="hero-visual hero-photo-compare" aria-label="Illustrative before and after example of memorial care">
        <figure class="comparison-photo">
          <img src="assets/memorial-care-before.webp?v=20260911" alt="Illustrative before view of a weathered granite cemetery memorial">
          <figcaption>Before</figcaption>
        </figure>
        <figure class="comparison-photo">
          <img src="assets/memorial-care-after.webp?v=20260911" alt="Illustrative after view of the same granite cemetery memorial following careful cleaning">
          <figcaption>After</figcaption>
        </figure>
        <div class="report-card"><span class="report-icon" aria-hidden="true">✓</span><div><strong>Illustrative sample</strong><span>Real visits are photo documented</span></div></div>
      </div>'''
          new = '''      <div class="hero-visual" aria-label="Illustrative before and after example of memorial care">
        <img src="assets/grave-memorial-cleaning-before-after.jpg?v=20260911-2" alt="Illustrative before-and-after example of a weathered cemetery memorial following careful cleaning">
        <div class="report-card"><span class="report-icon" aria-hidden="true">✓</span><div><strong>Illustrative sample</strong><span>Real visits are photo documented</span></div></div>
      </div>'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one hero block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Validate distinct image usage
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'assets/grave-memorial-cleaning-before-after.jpg?v=20260911-2' index.html
          grep -Fq 'assets/memorial-care-before.webp?v=20260911' index.html
          grep -Fq 'assets/memorial-care-after.webp?v=20260911' index.html
          test "$(grep -o 'assets/memorial-care-before.webp?v=20260911' index.html | wc -l)" -eq 1
          test "$(grep -o 'assets/memorial-care-after.webp?v=20260911' index.html | wc -l)" -eq 1

      - name: Commit hero image fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use distinct memorial image in homepage hero'
          git push
